<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เกม AR ฝึกอ่านคำภาษาไทย</title>
    
    <!-- Google Fonts: Mitr (Playful Thai Font) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Mitr', 'sans-serif'],
                    },
                    colors: {
                        pastel: {
                            pink: '#ffb3c6',
                            orange: '#ffc8dd',
                            yellow: '#fcf6bd',
                            green: '#d0f4de',
                            blue: '#a9def9'
                        }
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'bounce-slight': 'bounceSlight 2s infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        bounceSlight: {
                            '0%, 100%': { transform: 'translateY(-5%)' },
                            '50%': { transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Canvas Confetti for celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- MediaPipe Face Mesh for AR -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        /* Glassmorphism Panel */
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 12px 40px 0 rgba(255, 150, 200, 0.2);
        }
        
        /* Bubbly Button Style */
        .btn-bubbly {
            transition: all 0.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        .btn-bubbly:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.2);
        }
        .btn-bubbly:active {
            transform: scale(0.95) translateY(2px);
        }

        /* Video and Canvas Covering */
        .viewport-cover {
            object-fit: cover;
            width: 100%;
            height: 100%;
            transform: scaleX(-1); /* Mirror effect */
        }

        /* Vignette for incorrect answers */
        .vignette-active {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background: radial-gradient(circle, rgba(0,0,0,0) 30%, rgba(200,0,0,0.5) 100%);
            z-index: 10;
            animation: pulse-dark 1s infinite alternate;
        }

        @keyframes pulse-dark {
            0% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* Progress Bar */
        .meter-bar {
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s ease;
        }

        /* Sound Wave Animation */
        .sound-wave {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 30px;
        }
        .sound-wave span {
            display: block;
            width: 6px;
            height: 100%;
            background-color: white;
            border-radius: 99px;
            animation: wave 1s ease-in-out infinite;
        }
        .sound-wave span:nth-child(2) { animation-delay: 0.1s; }
        .sound-wave span:nth-child(3) { animation-delay: 0.2s; }
        .sound-wave span:nth-child(4) { animation-delay: 0.3s; }
        .sound-wave span:nth-child(5) { animation-delay: 0.4s; }

        @keyframes wave {
            0%, 100% { height: 30%; }
            50% { height: 100%; }
        }
    </style>
</head>

<body class="h-screen w-screen overflow-hidden bg-gradient-to-br from-pastel-pink via-pastel-orange to-pastel-yellow text-gray-800 selection:bg-pink-300">

    <!-- OVERLAYS -->
    
    <!-- 1. Start Screen -->
    <div id="startScreen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-white/85 backdrop-blur-md transition-opacity duration-500">
        <div class="animate-float text-center">
            <h1 class="text-5xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-orange-500 mb-4 drop-shadow-sm px-4">
                🌟 เกมอัจฉริยะนักอ่าน AR
            </h1>
        </div>
        <p class="text-xl md:text-2xl text-gray-600 mb-10 text-center px-6 max-w-2xl font-medium">
            ฝึกอ่านคำภาษาไทยไปพร้อมกับเวทมนตร์ AR!<br>
            <span class="text-sm md:text-base text-gray-500 font-normal">(ระบบต้องการสิทธิ์เข้าถึง <b>กล้อง</b> และ <b>ไมโครโฟน</b>)</span>
        </p>
        <button id="btnStart" class="btn-bubbly px-12 py-5 bg-gradient-to-r from-pink-400 to-orange-400 text-white text-3xl font-bold rounded-full shadow-lg disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none border-4 border-white">

        </button>
        <div id="loadingIndicator" class="mt-8 flex flex-col items-center hidden">
            <div class="w-12 h-12 border-4 border-pink-300 border-t-pink-500 rounded-full animate-spin mb-2"></div>
            <p class="text-pink-500 font-medium">กำลังเตรียมเวทมนตร์ AI...</p>

    <!-- 2. End Screen -->
    <div id="endScreen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-white/95 backdrop-blur-md hidden transition-opacity duration-500">
        <h2 id="endTitle" class="text-5xl md:text-6xl font-bold text-pink-500 mb-6 drop-shadow-sm animate-bounce-slight">สรุปคะแนน</h2>
        <div class="relative mb-8">
            <div class="absolute inset-0 bg-yellow-300 blur-2xl opacity-50 rounded-full"></div>
            <div class="text-9xl font-black text-transparent bg-clip-text bg-gradient-to-br from-pink-500 via-red-500 to-orange-500 relative z-10" id="finalScoreText">0/10</div>
        </div>
        <p id="endMessage" class="text-3xl text-gray-700 mb-10 font-medium text-center px-4">ยอดเยี่ยมมาก!</p>
        
        <div id="saveScoreContainer" class="flex flex-col items-center mb-6">
            <button id="btnSaveScore" class="btn-bubbly px-8 py-3 bg-gradient-to-r from-blue-400 to-indigo-400 text-white text-xl font-bold rounded-full shadow-lg border-2 border-white mb-2 flex items-center gap-2">
                <span>💾 บันทึกคะแนน</span>
                <div id="saveSpinner" class="hidden w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>

        <button id="btnRestart" class="btn-bubbly px-10 py-4 bg-gradient-to-r from-green-400 to-teal-400 text-white text-2xl font-bold rounded-full shadow-lg border-4 border-white">

    <!-- MAIN LAYOUT -->
    <div class="flex flex-col md:flex-row h-full w-full">
        
        <!-- Left Panel: UI & Gameplay -->
        <div class="w-full md:w-1/2 h-[45%] md:h-full p-4 md:p-8 flex flex-col justify-center relative z-10">
            <div class="glass-panel h-full rounded-3xl p-5 md:p-10 flex flex-col justify-between">
                
                <!-- Header: Score & Progress -->
                <div class="flex justify-between items-center mb-2">
                    <div class="text-lg md:text-2xl font-semibold bg-white/80 px-4 py-2 rounded-2xl shadow-sm text-pink-600 border border-pink-100 flex items-center gap-2">
                        <span class="text-xl">📝</span> ข้อที่ <span id="currentQuestion" class="font-black">1/10</span>
                    </div>
                    <div class="text-lg md:text-2xl font-semibold bg-white/80 px-4 py-2 rounded-2xl shadow-sm text-orange-600 border border-orange-100 flex items-center gap-2">
                        <span class="text-xl">⭐</span> คะแนน <span id="scoreText" class="font-black">0</span>
                    </div>
                </div>

                <!-- Center: Word & Status -->
                <div class="flex flex-col items-center justify-center flex-grow text-center relative">
                    
                    <!-- Status Badge (Preparation / Result) -->
                    <div id="statusContainer" class="absolute top-0 w-full flex justify-center h-12 items-center">
                        <div id="statusBadge" class="bg-gray-400 text-white px-6 py-2 rounded-full text-lg md:text-xl font-medium shadow-md transition-all duration-300 transform scale-100">

                    <!-- The Target Word -->
                    <div class="mt-8 mb-4">

                    </div>
                    
                    <!-- Reading Guide -->
                    <p id="spellWord" class="text-xl md:text-3xl text-gray-500 font-medium bg-white/50 px-6 py-2 rounded-full inline-block">
                        (คำอ่าน)
                    </p>
                    
                    <!-- Result Message Text -->
                    <div id="resultMsg" class="h-10 mt-4 text-xl md:text-2xl font-bold opacity-0 transition-opacity duration-300 flex items-center justify-center"></div>

                    <!-- Listening Animation Overlay (Hidden by default) -->
                    <div id="listeningAnim" class="absolute top-0 w-full flex justify-center h-12 items-center hidden">

                    </div>
                    <div class="w-full h-6 bg-gray-200/80 rounded-full overflow-hidden shadow-inner border border-gray-300">

                        </div>
                    </div>
                </div>
                
            </div>
        </div>

        <!-- Right Panel: Camera Viewport & AR -->
        <div class="w-full md:w-1/2 h-[55%] md:h-full relative bg-gray-900 shadow-2xl z-0 rounded-t-3xl md:rounded-t-none md:rounded-l-3xl overflow-hidden border-t-4 md:border-t-0 md:border-l-4 border-white/50">
            <video id="videoElement" class="hidden" playsinline autoplay></video>
            <!-- Canvas วาดทับหน้า -->
            <canvas id="outputCanvas" class="viewport-cover absolute inset-0"></canvas>
            
            <!-- กรอบคำแนะนำกล้อง -->
            <div id="cameraGuide" class="absolute inset-0 pointer-events-none flex items-center justify-center border-8 border-dashed border-white/20 m-8 rounded-3xl opacity-50">
                <span class="text-white/50 text-xl font-bold bg-black/20 px-4 py-2 rounded-full backdrop-blur-sm">จัดใบหน้าให้อยู่ตรงกลาง</span>
            </div>

            <!-- ขอบมืดแสดงตอนตอบผิด -->
            <div id="vignette" class="hidden vignette-active"></div>
        </div>

    </div>

    <!-- ===== JavaScript Logic ===== -->
    <script>
        /**
         * 1. ข้อมูลคำศัพท์ (Dictionary)
         */
        const ALL_WORDS = [
            // หมวดร่างกาย
            { word: "ตา", spell: "ตอ - อา - ตา" }, { word: "หู", spell: "หอ - อู - หู" }, { word: "ขา", spell: "ขอ - อา - ขา" },
            { word: "ปาก", spell: "ปอ - อา - กอ - ปาก" }, { word: "จมูก", spell: "จอ - มอ - อู - กอ - จมูก" },
            { word: "แขน", spell: "ขอ - แอ - นอ - แขน" }, { word: "มือ", spell: "มอ - อือ - มือ" },
            { word: "นิ้ว", spell: "นอ - อิ - วอ - นิ้ว" }, { word: "หัว", spell: "หอ - อัว - หัว" }, { word: "ผม", spell: "ผอ - โอะ - มอ - ผม" },
            // หมวดสัตว์
            { word: "หมา", spell: "หอ - มอ - อา - หมา" }, { word: "แมว", spell: "มอ - แอ - วอ - แมว" },
            { word: "นก", spell: "นอ - โอะ - กอ - นก" }, { word: "ปลา", spell: "ปอ - ลอ - อา - ปลา" },
            { word: "หมู", spell: "หอ - มอ - อู - หมู" }, { word: "ไก่", spell: "กอ - ไอ - ไก่" },
            { word: "เป็ด", spell: "ปอ - เอะ - ดอ - เป็ด" }, { word: "ช้าง", spell: "ชอ - อา - งอ - ช้าง" },
            { word: "ม้า", spell: "มอ - อา - ม้า" }, { word: "วัว", spell: "วอ - อัว - วัว" },
            // หมวดผลไม้
            { word: "กล้วย", spell: "กอ - ลอ - อัว - ยอ - กล้วย" }, { word: "ส้ม", spell: "สอ - โอะ - มอ - ส้ม" },
            { word: "เงาะ", spell: "งอ - เอาะ - เงาะ" }, { word: "แตงโม", spell: "ตอ - แอ - งอ - แตง - มอ - โอ - โม" },
            { word: "มะม่วง", spell: "มะ - มอ - อัว - งอ - ม่วง" }, { word: "ชมพู่", spell: "ชอ - โอะ - มอ - ชม - พอ - อู - พู่" },
            { word: "ฝรั่ง", spell: "ฝอ - รอ - อะ - งอ - ฝรั่ง" }, { word: "องุ่น", spell: "ออ - งอ - อุ - นอ - องุ่น" },
            { word: "มะละกอ", spell: "มะ - ละ - กอ" }, { word: "ลำไย", spell: "ลอ - อำ - ลำ - ยอ - ไอ - ไย" },
            // คำพื้นฐาน
            { word: "วิ่ง", spell: "วอ - อิ - งอ - วิ่ง" }, { word: "เล่น", spell: "ลอ - เอ - นอ - เล่น" },
            { word: "กิน", spell: "กอ - อิ - นอ - กิน" }, { word: "นอน", spell: "นอ - ออ - นอ - นอน" },
            { word: "อ่าน", spell: "ออ - อา - นอ - อ่าน" }, { word: "เขียน", spell: "ขอ - เอีย - นอ - เขียน" },
            { word: "เรียน", spell: "รอ - เอีย - นอ - เรียน" }, { word: "ครู", spell: "คอ - รอ - อู - ครู" },
            { word: "เพื่อน", spell: "พอ - เอือ - นอ - เพื่อน" }, { word: "โรงเรียน", spell: "โรง - เรียน" }
        ];

        let gameWords = [];
        let currentWordIndex = 0;
        let score = 0;
        let isPlaying = false;
        let arState = 'NONE'; // 'NONE', 'CROWN', 'HORNS'
        let countdownInterval;
        let listeningTimeout;
        let recognitionActive = false; // Flag to prevent multiple start calls

        /**
         * 2. Web Audio API Synthesizer
         */
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playTone(freq, type, duration, vol, slideToFreq = null) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (slideToFreq) {
                osc.frequency.exponentialRampToValueAtTime(slideToFreq, audioCtx.currentTime + duration);
            }
            
            gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        const SoundEngine = {
            click: () => playTone(600, 'sine', 0.1, 0.3),
            tick: () => playTone(800, 'square', 0.1, 0.1),
            go: () => playTone(1200, 'square', 0.2, 0.2),
            correct: () => {
                playTone(523.25, 'sine', 0.15, 0.3); // C5
                setTimeout(() => playTone(659.25, 'sine', 0.15, 0.3), 100); // E5
                setTimeout(() => playTone(783.99, 'sine', 0.3, 0.4), 200); // G5
            },
            wrong: () => playTone(150, 'sawtooth', 0.4, 0.4, 100),
            warning: () => {
                playTone(400, 'triangle', 0.2, 0.2, 350);
                setTimeout(() => playTone(400, 'triangle', 0.2, 0.2, 350), 150);
            },
            fanfare: () => {
                const notes = [400, 500, 600, 800];
                notes.forEach((freq, i) => {
                    setTimeout(() => playTone(freq, 'sine', 0.2, 0.3), i * 150);
                });
                setTimeout(() => playTone(800, 'sine', 0.6, 0.4), notes.length * 150);
            },
            gameOver: () => {
                const notes = [300, 250, 200, 150];
                notes.forEach((freq, i) => {
                    setTimeout(() => playTone(freq, 'square', 0.3, 0.3), i * 300);
                });
            }
        };

        /**
         * 3. Web Speech API Setup
         */
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;
        
        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'th-TH';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            recognition.onstart = () => { 
                recognitionActive = true; 
                // ย้ายการจับเวลามาไว้ที่นี่ จะเริ่มนับ 5 วินาทีก็ต่อเมื่อไมค์เปิดสำเร็จแล้ว
                clearTimeout(listeningTimeout);
                listeningTimeout = setTimeout(() => {
                    if (recognitionActive) {
                        recognition.stop();
                    }
                    handleNoSound("ไม่ได้ยินเสียงเลยจ้า");
                }, 5000);
            };
            
            recognition.onend = () => { 
                recognitionActive = false; 
            };

            recognition.onresult = (event) => {
                clearTimeout(listeningTimeout);
                const spokenText = event.results[0][0].transcript;
                evaluateWord(spokenText);
            };

            recognition.onerror = (event) => {
                recognitionActive = false;
                console.warn("Speech Recognition Error:", event.error);
                if (event.error === 'not-allowed') {
                    clearTimeout(listeningTimeout);
                    handleNoSound("กรุณาอนุญาตให้ใช้ไมโครโฟน");
                } else if (event.error !== 'no-speech' && event.error !== 'aborted') {
                    // Only handle serious errors, let timeout handle no-speech
                    clearTimeout(listeningTimeout);
                    handleNoSound("เกิดข้อผิดพลาดในการรับเสียง");
                }
            };
        } else {
            alert("⚠️ เบราว์เซอร์ของคุณไม่รองรับระบบตรวจจับเสียง กรุณาใช้ Google Chrome หรือ Edge ล่าสุด");
        }

        // Logic ประเมินความเหมือน (Levenshtein based - simple)
        function similarityScore(str1, str2) {
            const clean1 = str1.replace(/[\s\.\,]/g, '').trim();
            const clean2 = str2.replace(/[\s\.\,]/g, '').trim();
            if(clean1 === clean2) return 100;
            if(clean1.includes(clean2) || clean2.includes(clean1)) return 85; 
            
            let matches = 0;
            const len = Math.max(clean1.length, clean2.length);
            for (let i = 0; i < Math.min(clean1.length, clean2.length); i++) {
                if (clean1[i] === clean2[i]) matches++;
            }
            return Math.floor((matches / len) * 100);
        }

        /**
         * 4. MediaPipe Face Mesh & Camera
         */
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('outputCanvas');
        const canvasCtx = canvasElement.getContext('2d');
        const vignette = document.getElementById('vignette');
        const cameraGuide = document.getElementById('cameraGuide');

        const faceMesh = new FaceMesh({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`;
        }});
        
        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: false,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults((results) => {
            // Hide guide once face is detected consistently (optional enhancement)
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                cameraGuide.style.opacity = '0';
            } else {
                cameraGuide.style.opacity = '0.5';
            }

            if(canvasElement.width !== videoElement.videoWidth && videoElement.videoWidth > 0) {
                canvasElement.width = videoElement.videoWidth;
                canvasElement.height = videoElement.videoHeight;
            }

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            // Draw Video Frame
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            
            // Draw AR Overlay
            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0 && arState !== 'NONE') {
                const landmarks = results.multiFaceLandmarks[0];
                // Distance between temples roughly represents face width
                const faceWidth = Math.abs(landmarks[234].x - landmarks[454].x) * canvasElement.width;

                if (arState === 'CROWN') {
                    // Index 10 is top of forehead
                    const forehead = landmarks[10];
                    const x = forehead.x * canvasElement.width;
                    const y = forehead.y * canvasElement.height;
                    
                    const size = faceWidth * 1.2; 
                    canvasCtx.font = `${size}px Arial`;
                    canvasCtx.textAlign = "center";
                    canvasCtx.textBaseline = "bottom";
                    // Offset slightly up
                    canvasCtx.fillText("👑", x, y + (size * 0.1)); 
                } 
                else if (arState === 'HORNS') {
                    // Indices for upper sides of head roughly
                    const leftSide = landmarks[54];
                    const rightSide = landmarks[284];
                    const size = faceWidth * 0.5;
                    
                    canvasCtx.font = `${size}px Arial`;
                    canvasCtx.textAlign = "center";
                    canvasCtx.textBaseline = "bottom";
                    
                    // Add slight rotation or offset if needed, simple fillText for now
                    canvasCtx.fillText("👿", leftSide.x * canvasElement.width, leftSide.y * canvasElement.height - (size*0.2));
                    canvasCtx.fillText("👿", rightSide.x * canvasElement.width, rightSide.y * canvasElement.height - (size*0.2));
                }
            }
            canvasCtx.restore();
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });

        /**
         * 5. Game Flow Logic
         */
        const elStartScreen = document.getElementById('startScreen');
        const elBtnStart = document.getElementById('btnStart');
        const elLoadingIndicator = document.getElementById('loadingIndicator');
        const elEndScreen = document.getElementById('endScreen');
        
        const elCurrentQuestion = document.getElementById('currentQuestion');
        const elScoreText = document.getElementById('scoreText');
        const elStatusBadge = document.getElementById('statusBadge');
        const elStatusContainer = document.getElementById('statusContainer');
        const elListeningAnim = document.getElementById('listeningAnim');
        
        const elTargetWord = document.getElementById('targetWord');
        const elSpellWord = document.getElementById('spellWord');
        const elResultMsg = document.getElementById('resultMsg');
        const elMeterFill = document.getElementById('meterFill');
        const elMeterText = document.getElementById('meterText');

        function shuffleAndPick(array, count) {
            const shuffled = [...array].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        async function startGame() {
            // 1. เพิ่มการแจ้งเตือน หากเบราว์เซอร์ไม่รองรับ
            if (!recognition) {
                alert("⚠️ ไม่สามารถเริ่มเกมได้: เบราว์เซอร์นี้ไม่รองรับระบบเสียง\n\n👉 กรุณาคัดลอกลิงก์ (Copy Link) ไปเปิดในแอป Google Chrome เท่านั้นครับ");
                return;
            }
            
            SoundEngine.click();
            elBtnStart.disabled = true;
            elBtnStart.classList.add('hidden');
            elLoadingIndicator.classList.remove('hidden');

            try {
                // Initialize Audio Context on user gesture
                if (audioCtx.state === 'suspended') await audioCtx.resume();
                
                // Request Camera
                await camera.start();
                
                elStartScreen.classList.add('opacity-0');
                setTimeout(() => elStartScreen.classList.add('hidden'), 500);
                
                gameWords = shuffleAndPick(ALL_WORDS, 10);
                currentWordIndex = 0;
                score = 0;
                isPlaying = true;
                
                updateScoreUI();
                playNextWord();

            } catch (err) {
                // 2. ปรับการแจ้งเตือนให้บอกสาเหตุของ Error ชัดเจนขึ้น
                alert("เกิดข้อผิดพลาดในการเปิดกล้อง: " + err.message + "\n\nระบบต้องการสิทธิ์เข้าถึงกล้องและไมค์ กรุณากดยอมรับ หรือลองใช้ Google Chrome ครับ");
                console.error("Start Game Error:", err);
                elBtnStart.disabled = false;
                elBtnStart.classList.remove('hidden');
                elLoadingIndicator.classList.add('hidden');
            }
        }

        function updateScoreUI() {
            elCurrentQuestion.innerText = `${currentWordIndex + 1}/${gameWords.length}`;
            elScoreText.innerText = score;
        }

        function setBadge(text, colorClass, animationClass = '') {
            elStatusContainer.classList.remove('hidden');
            elListeningAnim.classList.add('hidden');
            
            elStatusBadge.innerText = text;
            elStatusBadge.className = `text-white px-6 py-2 rounded-full text-lg md:text-xl font-bold shadow-md transition-all duration-300 ${colorClass} ${animationClass}`;
        }

        function showListeningVisuals() {
            elStatusContainer.classList.add('hidden');
            elListeningAnim.classList.remove('hidden');
        }

        function setMeter(percent, colorClass) {
            elMeterFill.className = `meter-bar h-full rounded-full relative ${colorClass}`;
            elMeterFill.style.width = `${percent}%`;
            elMeterText.innerText = `${percent}%`;
            elMeterText.className = percent >= 80 ? 'text-green-600 font-bold' : (percent > 0 ? 'text-red-600 font-bold' : 'text-gray-400');
        }

        function playNextWord() {
            if (currentWordIndex >= gameWords.length) {
                endGame();
                return;
            }

            const currentObj = gameWords[currentWordIndex];
            elTargetWord.innerText = currentObj.word;
            elSpellWord.innerText = currentObj.spell;
            
            // Pop effect for new word
            elTargetWord.classList.remove('scale-100');
            elTargetWord.classList.add('scale-110', 'text-pink-500');
            setTimeout(() => {
                elTargetWord.classList.remove('scale-110', 'text-pink-500');
                elTargetWord.classList.add('scale-100', 'text-gray-800');
            }, 300);

            // Reset UI
            elResultMsg.style.opacity = '0';
            setMeter(0, 'bg-gray-300');
            arState = 'NONE';
            vignette.classList.add('hidden');
            updateScoreUI();
            
            // Countdown
            let count = 3;
            setBadge(`เตรียมตัว... ${count}`, 'bg-yellow-400 text-yellow-900', 'scale-110');
            SoundEngine.tick();

            countdownInterval = setInterval(() => {
                count--;
                if (count > 0) {
                    setBadge(`เตรียมตัว... ${count}`, 'bg-yellow-400 text-yellow-900', 'scale-110');
                    SoundEngine.tick();
                } else {
                    clearInterval(countdownInterval);
                    startListening();
                }
            }, 1000);
        }

        function startListening() {
            showListeningVisuals();
            SoundEngine.go();
            
            try {
                if(!recognitionActive) {
                    recognition.start();
                }
            } catch(e) {
                console.warn("Recognition start skipped/error:", e);
                recognitionActive = false; // รีเซ็ตสถานะเผื่อเกิดข้อผิดพลาด
            }

            // การจับเวลา 5 วินาที ถูกย้ายไปจัดการใน recognition.onstart แล้ว 
            // เพื่อไม่ให้หมดเวลาระหว่างที่ผู้ใช้กำลังกด Allow Permission
        }

        function evaluateWord(spokenText) {
            const target = gameWords[currentWordIndex].word;
            const sim = similarityScore(target, spokenText);
            
            elResultMsg.style.opacity = '1';

            if (sim >= 80) {
                // Correct
                score++;
                arState = 'CROWN';
                setMeter(sim, 'bg-gradient-to-r from-green-400 to-green-500');
                setBadge(`พูดว่า: "${spokenText}"`, 'bg-green-100 text-green-800 border border-green-300');
                
                elResultMsg.innerHTML = "✨ เก่งมาก! รับไป 1 คะแนน ✨";
                elResultMsg.className = "h-10 mt-4 text-xl md:text-2xl font-black transition-opacity duration-300 text-green-500 animate-bounce-slight";
                
                SoundEngine.correct();
                confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 }, colors: ['#ffb3c6', '#fcf6bd', '#d0f4de'] });

            } else {
                // Incorrect
                arState = 'HORNS';
                vignette.classList.remove('hidden');
                setMeter(Math.max(sim, 10), 'bg-gradient-to-r from-red-400 to-red-500'); // At least show a little red
                setBadge(`ได้ยินว่า: "${spokenText}"`, 'bg-red-100 text-red-800 border border-red-300');
                
                elResultMsg.innerHTML = "❌ ยังไม่เป๊ะ พยายามเข้านะ";
                elResultMsg.className = "h-10 mt-4 text-xl md:text-2xl font-bold transition-opacity duration-300 text-red-500";
                
                SoundEngine.wrong();
            }
            
            updateScoreUI();

            setTimeout(() => {
                currentWordIndex++;
                playNextWord();
            }, 3500);
        }

        function handleNoSound(msg) {
            arState = 'NONE';
            setMeter(0, 'bg-gray-300');
            setBadge(`หมดเวลา!`, 'bg-yellow-500');
            
            elResultMsg.innerHTML = `⚠️ ${msg}`;
            elResultMsg.className = "h-10 mt-4 text-xl md:text-2xl font-bold transition-opacity duration-300 text-yellow-600";
            elResultMsg.style.opacity = '1';
            
            SoundEngine.warning();

            // Retry same word
            setTimeout(() => {
                playNextWord();
            }, 3000);
        }

        function endGame() {
            isPlaying = false;
            elEndScreen.classList.remove('hidden');
            setTimeout(() => elEndScreen.classList.remove('opacity-0'), 50);
            
            document.getElementById('finalScoreText').innerText = `${score}/10`;
            const elMsg = document.getElementById('endMessage');
            
            const elBtnSaveScore = document.getElementById('btnSaveScore');
            const elSaveStatusMsg = document.getElementById('saveStatusMsg');
            const elSaveSpinner = document.getElementById('saveSpinner');
            elBtnSaveScore.classList.remove('hidden');
            elBtnSaveScore.disabled = false;
            elBtnSaveScore.classList.replace('from-gray-400', 'from-blue-400');
            elBtnSaveScore.classList.replace('to-gray-500', 'to-indigo-400');
            elSaveStatusMsg.innerText = '';
            elSaveStatusMsg.className = 'text-sm font-medium text-gray-500 h-5';
            elSaveSpinner.classList.add('hidden');
            
            if (score >= 8) {
                elMsg.innerHTML = "สุดยอด! หนูคือนักอ่านอัจฉริยะ 🏆";
                SoundEngine.fanfare();
                let end = Date.now() + 3000;
                (function frame() {
                    confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ffb3c6', '#a9def9'] });
                    confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#fcf6bd', '#d0f4de'] });
                    if (Date.now() < end) requestAnimationFrame(frame);
                }());
            } else if (score >= 5) {
                elMsg.innerHTML = "เก่งมาก! ฝึกอีกนิดจะเป๊ะเลย 👍";
                SoundEngine.correct();
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            } else {
                elMsg.innerHTML = "ไม่เป็นไรนะ ฝึกอ่านบ่อยๆ เดี๋ยวก็เก่ง! 💪";
                SoundEngine.gameOver();
            }
        }

        document.getElementById('btnSaveScore').addEventListener('click', () => {
            SoundEngine.click();
            const btn = document.getElementById('btnSaveScore');
            const statusMsg = document.getElementById('saveStatusMsg');
            const spinner = document.getElementById('saveSpinner');
            
            // เปลี่ยนปุ่มเป็นสถานะกำลังโหลด
            btn.disabled = true;
            spinner.classList.remove('hidden');
            statusMsg.innerText = 'กำลังบันทึกข้อมูล...';
            statusMsg.className = 'text-sm font-medium text-blue-500 h-5';

            // เตรียมข้อมูลที่จะส่งไปบันทึก
            const scoreData = {
                score: score,
                maxScore: 10
            };

            // URL ของ Web App Google Apps Script ของคุณ
            const scriptUrl = 'https://script.google.com/macros/s/AKfycby716SZsHT4kZXjG_p47bGrirsVOKXGVNMvzdikk4ocPpBTfJLobMxR0trMrlhRxTDqSA/exec';

            // ส่งข้อมูลจากเว็บ GitHub ไปยัง Google Sheet ด้วย fetch API
            fetch(scriptUrl, {
                method: 'POST',
                body: JSON.stringify(scoreData),
                headers: {
                    // ใช้ text/plain เพื่อป้องกันปัญหา CORS (การบล็อกข้ามโดเมน)
                    'Content-Type': 'text/plain;charset=utf-8' 
                }
            })
            .then(response => response.json())
            .then(data => {
                spinner.classList.add('hidden');
                if (data && data.success) {
                    btn.classList.add('hidden'); // ซ่อนปุ่มเมื่อบันทึกสำเร็จ
                    statusMsg.innerText = '✅ บันทึกคะแนนสำเร็จ!';
                    statusMsg.className = 'text-sm font-bold text-green-500 h-5';
                } else {
                    btn.disabled = false;
                    statusMsg.innerText = '❌ เกิดข้อผิดพลาด: ' + (data ? data.message : 'ไม่ทราบสาเหตุ');
                    statusMsg.className = 'text-sm font-medium text-red-500 h-5';
                }
            })
            .catch(error => {
                spinner.classList.add('hidden');
                btn.disabled = false;
                statusMsg.innerText = '❌ การเชื่อมต่อผิดพลาด โปรดลองใหม่';
                statusMsg.className = 'text-sm font-medium text-red-500 h-5';
                console.error("Save Score Error:", error);
            });
        });

        // Event Listeners
        elBtnStart.addEventListener('click', startGame);
        
        document.getElementById('btnRestart').addEventListener('click', () => {
            SoundEngine.click();
            elEndScreen.classList.add('opacity-0');
            setTimeout(() => {
                elEndScreen.classList.add('hidden');
                gameWords = shuffleAndPick(ALL_WORDS, 10);
                currentWordIndex = 0;
                score = 0;
                updateScoreUI();
                playNextWord();
            }, 500);
        });

    </script>
</body>
</html>
